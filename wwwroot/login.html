<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f5"><title>Вход · Библиотека МАФ</title><link rel="stylesheet" href="/style.css?v=8"><style>
body{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(390px,100%);padding:28px;border:1px solid #e6e9e2;border-radius:14px;background:#fff;box-shadow:0 20px 60px #18211914}.login-card h1{margin:0 0 7px;font:700 22px Manrope,sans-serif}.login-card p{margin:0 0 22px;color:#83877e;font-size:12px}.login-card label{display:block;margin:12px 0 6px;color:#62695f;font-size:11px}.login-card input{width:100%;padding:11px;border:1px solid #e1e5dd;border-radius:7px;font:13px 'DM Sans',sans-serif}.login-card button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:7px;background:#304b36;color:white;font:600 12px 'DM Sans',sans-serif;cursor:pointer}.login-error{min-height:16px;margin-top:12px;color:#a3483e;font-size:11px}.login-brand{margin-bottom:20px;color:#405b43;font-weight:800;letter-spacing:.08em}
</style></head><body><main class="login-card"><div class="login-brand"></div><h1>Вход для сотрудников</h1><p>Введите персональные учётные данные.</p><form id="loginForm"><label for="username">Имя пользователя</label><input id="username" name="username" autocomplete="username" required><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Войти</button><div id="loginError" class="login-error" role="alert"></div></form></main><script>
document.querySelector('#loginForm').addEventListener('submit',async event=>{event.preventDefault();const error=document.querySelector('#loginError');error.textContent='';try{const response=await fetch('/api/session/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(!response.ok)throw new Error(response.status===429?'Слишком много попыток. Повторите позже.':'Неверное имя пользователя или пароль.');location.replace('/library')}catch(e){error.textContent=e.message}});fetch('/api/session/me').then(r=>{if(r.ok)location.replace('/library')});
</script></body></html>
