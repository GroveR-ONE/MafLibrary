<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5"><title>МАФ · Каталог изделий</title><link rel="icon" href="/favicon.ico?v=2" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=8">
</head>
<body class="public-view">
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="МАФ библиотека"><span class="brand-mark">М</span><span class="brand-name">МАФ<span>БИБЛИОТЕКА</span></span></a>
    <div class="side-caption">КАТАЛОГ</div>
    <button class="nav-item active" id="allNav"><span class="nav-icon">▦</span> Все изделия <span class="nav-count" id="allCount">0</span></button>
    <div class="side-caption category-caption">КАТЕГОРИИ</div>
    <label class="nav-search"><span aria-hidden="true">⌕</span><input id="categorySearch" type="search" placeholder="Найти категорию" aria-label="Поиск по категориям"></label>
    <nav id="categoryNav" class="category-list"></nav>
    <div class="side-caption category-caption orders-caption">ЗАКАЗЫ</div>
    <label class="nav-search"><span aria-hidden="true">⌕</span><input id="orderSearch" type="search" placeholder="Найти заказ" aria-label="Поиск по заказам"></label>
    <nav id="orderNav" class="category-list"></nav>
    <div class="sidebar-bottom"><div class="server-dot"></div><span>Публичный каталог</span></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="mobile-menu-button" id="mobileMenuButton" aria-label="Открыть каталог" aria-expanded="false">☰</button><div class="breadcrumb"><span>МАФ</span><span class="crumb-divider">/</span><b id="currentCategory">Все изделия</b></div><div class="top-actions"></div></header>
    <section class="content">
      <div class="welcome-row"><div><div class="eyebrow"></div><h1>Изделия МАФ<span class="title-period"></span></h1><p class="subtitle">Библиотека конструкций, чертежей и визуализаций.</p></div><div class="welcome-actions"><div class="hero-stat"><span class="stat-number" id="heroCount">—</span><span class="stat-label">изделий в каталоге</span><span class="stat-decoration">✳</span></div></div></div>
       <div class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="Поиск по номеру, названию, примечанию…"></label><select id="sortSelect" class="sort-select" aria-label="Сортировка"><option value="number">По номеру</option><option value="name">По названию</option><option value="category">По категории</option></select></div>
      <div class="results-bar"><span id="resultsLabel">Все изделия</span><div class="view-toggle"><button class="view-option selected" title="Карточки">▦</button><button class="view-option" title="Список">☷</button></div></div>
      <div id="productGrid" class="product-grid"></div>
      <div id="emptyState" class="empty-state hidden"><div class="empty-icon">⌕</div><h2>Пока ничего не найдено</h2><p>Измените поисковый запрос или выберите другую категорию.</p></div>
       <footer class="footer"><span>МАФ · Каталог изделий</span><span id="footerCount"></span></footer>
    </section>
  </main>
</div>
<button id="sidebarBackdrop" class="sidebar-backdrop" aria-label="Закрыть каталог" tabindex="-1"></button><div id="modalRoot"></div><div id="toast" class="toast"></div>
<script src="/public.js?v=2"></script>
</body></html>
